version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: billpay-postgres
    environment:
      POSTGRES_DB: billpay
      POSTGRES_USER: billpay
      POSTGRES_PASSWORD: billpay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billpay"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: